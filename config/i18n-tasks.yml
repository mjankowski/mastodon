# i18n-tasks finds and manages missing and unused translations: https://github.com/glebm/i18n-tasks

# The "main" locale.
base_locale: en
data:
  read:
    - config/locales/%{locale}.yml
    - config/locales/**/*.%{locale}.yml

  write:
    - ['{devise, simple_form, doorkeeper}.*', 'config/locales/\1.%{locale}.yml']
    - config/locales/%{locale}.yml

  yaml:
    write:
      line_width: -1

search:
  strict: false
  paths:
    - app/
    - config/navigation.rb

  exclude:
    - app/javascript

  ast_matchers:
    - 'I18n::Tasks::Scanners::AstMatchers::DefaultI18nSubjectMatcher'

ignore_missing:
  - 'activerecord.attributes.*'
  - 'activerecord.errors.*'
  - '{pagination,doorkeeper}.*'
  - '{date,datetime,time,number}.*'
  - 'errors.messages.*'
  - 'sessions.{browsers,platforms}.*'
  - 'application_mailer.salutation'
  - 'auth.providers.*'

ignore_unused:
  - 'activerecord.attributes.*'
  - 'activerecord.errors.*'
  - '{devise,pagination,doorkeeper}.*'
  - '{date,datetime,time,number}.*'
  - 'simple_form.{yes,no,recommended,not_recommended,overridden}'
  - 'simple_form.{placeholders,hints,labels}.*'
  - 'simple_form.{error_notification,required}.:'
  - 'errors.messages.*'
  - 'email_subscription_mailer.notification.*'
  - 'notification_mailer.admin.*'
  - 'preferences.other' # some locales are missing other keys, therefore leading i18n-tasks to detect `preferences` as plural and not finding use
  - 'edit_profile.other' # some locales are missing other keys, therefore leading i18n-tasks to detect `edit_profile` as plural and not finding use
  - 'admin.terms_of_service.generate' # temporarily disabled
  - 'admin.username_blocks.matches_exactly_html'
  - 'admin.username_blocks.contains_html'
  - 'accounts.api_errors.{2fa_required,account_deleted,account_suspended,login_disabled,memorial,pending_approval,pending_confirmation}'

ignore_inconsistent_interpolations:
  - '*.one'
